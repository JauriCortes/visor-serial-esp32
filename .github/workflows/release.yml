# Builds the downloadable binaries: an AppImage for Linux and a zip for
# Windows.  Pushing a v* tag also publishes them as a GitHub Release; a push to
# main only builds, which is what tells us the Windows side still compiles.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3

jobs:
  linux:
    # Not ubuntu-latest on purpose: the AppImage inherits the glibc it was
    # built against, so building on 22.04 (glibc 2.35) is what lets it start on
    # Ubuntu 22.04/24.04, Debian 12, Fedora 36+ and Arch alike.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Qt's xcb platform plugin links against these; they have to exist on the
      # machine for linuxdeploy to find them and copy them into the AppImage.
      - name: Install the X11 libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libglx-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libfontconfig1 libfreetype6 libudev-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialport
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      # RNF-08: the pipeline classes run with no window and no serial port, so
      # the runner can check them as they are.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install into the AppDir
        run: cmake --install build --prefix AppDir/usr

      - name: Fetch linuxdeploy
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSLO $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -fsSLO $base/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          echo "$PWD" >> $GITHUB_PATH

      - name: Build the AppImage
        env:
          # The runners have no FUSE, so the tools unpack themselves instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Without this the plugin never scans our imports and the AppImage
          # ships without QtQuick.Controls.Material, QtQuick.Particles or
          # QtQuick.Dialogs -- it would build fine and die on the first window.
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          OUTPUT: esp32visor-x86_64.AppImage
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage \
            --desktop-file AppDir/usr/share/applications/esp32visor.desktop \
            --icon-file packaging/esp32visor.svg

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: esp32visor-x86_64.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtserialport
          cache: true

      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # The install step runs windeployqt (see CMakeLists.txt), so this leaves
      # the .exe together with the Qt DLLs, the QML modules and the MSVC runtime.
      # windeployqt copies the MSVC runtime out of the Visual Studio install,
      # and only finds it with the compiler environment loaded.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE/dist"
          # Called on the .exe with no --dir, windeployqt puts the Qt DLLs, the
          # platform plugins and the QML modules right beside it: one flat
          # folder that runs from wherever it is unzipped.  --qmldir is what
          # makes it scan our imports (Material, Particles, Dialogs).
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
              --release --compiler-runtime --qmldir qml `
              "$env:GITHUB_WORKSPACE\dist\esp32visor.exe"
          Compress-Archive -Path dist/* -DestinationPath esp32visor-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: esp32visor-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
